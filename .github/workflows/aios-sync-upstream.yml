# Keeps this fork in step with block/buzz once a day.
# A conflict with upstream fails the run, and GitHub emails the owner.
name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  sync:
    if: github.repository == 'Skralo/buzz'
    runs-on: ubuntu-latest
    steps:
      - name: Merge block/buzz main into this fork
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main

      - name: Keep upstream CI and release workflows switched off
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[] | select(.state == "active" and .path != ".github/workflows/aios-sync-upstream.yml") | .id' |
          while read -r id; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$id/disable"
          done
